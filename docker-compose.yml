# Postgres + API. The Angular app runs with `npm start` (see front-ibm-bank/README.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ibm-bank-challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./back-ibm-bank
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ibm-bank-challenge
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
