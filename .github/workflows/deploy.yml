name: Deploy to Render

# Runs only after the CI workflow succeeded on main (or manually).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for v in RENDER_API_KEY RENDER_SERVICE_ID DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; missing=1; fi
          done
          exit $missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

      # PUT replaces ALL env vars of the service, so this is the single source of truth.
      - name: Sync environment variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          payload=$(jq -n \
            --arg url "$DATABASE_URL" --arg user "$DATABASE_USERNAME" \
            --arg pass "$DATABASE_PASSWORD" --arg cors "$CORS_ALLOWED_ORIGINS" '
            [
              {key: "DATABASE_URL", value: $url},
              {key: "DATABASE_USERNAME", value: $user},
              {key: "DATABASE_PASSWORD", value: $pass}
            ] + (if $cors == "" then [] else [{key: "CORS_ALLOWED_ORIGINS", value: $cors}] end)')
          curl -fsS -X PUT "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" > /dev/null
          echo "Environment variables synced"

      - name: Trigger deploy
        id: deploy
        run: |
          id=$(curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' | jq -r '.id')
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "Deploy $id started"

      - name: Wait for the deploy to go live
        run: |
          for i in $(seq 1 60); do
            status=$(curl -fsS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/${{ steps.deploy.outputs.deploy_id }}" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "[$i] status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated) echo "::error::Deploy ended with $status"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for the deploy"; exit 1

      - name: Health check
        if: vars.RENDER_HEALTH_URL != ''
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "${{ vars.RENDER_HEALTH_URL }}"
