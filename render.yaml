# Render Blueprint: Spring Boot API (Docker) + Angular front end (static site).
# The database is NOT created here: point DATABASE_* at your existing Postgres.
services:
  # --- API: built from back-ibm-bank/Dockerfile ---
  - type: web
    name: ibm-bank-challenge
    runtime: docker
    plan: free
    dockerfilePath: ./back-ibm-bank/Dockerfile
    dockerContext: ./back-ibm-bank
    healthCheckPath: /actuator/health
    # Deployed by .github/workflows/deploy.yml after CI passes (it also syncs the env vars).
    autoDeploy: false
    envVars:
      - key: DATABASE_URL        # jdbc:postgresql://host:5432/db
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,https://ibm-bank-front.onrender.com

  # --- Front end: Angular static site ---
  - type: web
    name: ibm-bank-front
    runtime: static
    rootDir: front-ibm-bank
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/front-ibm-bank/browser
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
