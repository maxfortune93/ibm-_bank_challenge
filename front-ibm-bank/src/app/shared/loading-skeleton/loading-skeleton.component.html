<div *ngIf="isLoading" class="skeleton" role="status" aria-live="polite">
  <p class="skeleton-message">{{ loadingMessage }}</p>
  <p class="skeleton-info">Por usar um banco de dados gratuito, o primeiro carregamento pode demorar alguns segundos.</p>
  <ngx-skeleton-loader [count]="count" [appearance]="appearance" [theme]="theme"></ngx-skeleton-loader>
</div>
