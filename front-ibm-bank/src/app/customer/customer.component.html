<div class="page-header">
  <h1>Clientes</h1>
  <button mat-flat-button color="primary" (click)="openRegisterModal()">
    <mat-icon>person_add</mat-icon>
    Cadastrar
  </button>
</div>

<app-search-filter (searchChanged)="onSearchChanged($event)"></app-search-filter>

<app-loading-skeleton
  [isLoading]="isLoading"
  [loadingMessage]="loadingMessage"
  [count]="5"
  appearance="line"
  [theme]="{ 'background-color': 'var(--surface-hover)', height: '64px', 'margin-bottom': '10px', 'border-radius': '12px' }">
</app-loading-skeleton>

<ng-container *ngIf="!isLoading">
  <ul class="customer-list" *ngIf="customers.length > 0; else empty">
    <li *ngFor="let customer of customers; let i = index" [style.animation-delay.ms]="i * 60">
      <button type="button" class="customer-row panel" (click)="viewCustomerDetails(customer.id!)">
        <span class="avatar" aria-hidden="true">{{ initials(customer.name) }}</span>

        <span class="identity">
          <span class="name">{{ customer.name }}</span>
          <span class="email">{{ customer.email }}</span>
        </span>

        <span class="bank">
          <span>{{ customer.bankName }}</span>
          <span class="muted">Ag. {{ customer.branch }}</span>
        </span>

        <span class="account">
          <span class="muted">Conta</span>
          <span>{{ formatNumberWithHyphen(customer.accountNumber) }}</span>
        </span>

        <mat-icon class="chevron" aria-hidden="true">chevron_right</mat-icon>
      </button>
    </li>
  </ul>

  <ng-template #empty>
    <div class="empty-state panel">
      <mat-icon>person_search</mat-icon>
      <strong>Nenhum cliente encontrado</strong>
      <span>{{ searchTerm ? 'Tente outro termo de busca.' : 'Cadastre o primeiro cliente para começar.' }}</span>
    </div>
  </ng-template>

  <mat-paginator
    *ngIf="totalElements > 0"
    [length]="totalElements"
    [pageSize]="size"
    [pageIndex]="page"
    [pageSizeOptions]="[5, 10]"
    (page)="onPageChange($event)">
  </mat-paginator>
</ng-container>
