<div class="page-header">
  <h1>Operações</h1>
  <button mat-stroked-button color="primary" (click)="openRegisterModal()">
    <mat-icon>person_add</mat-icon>
    Novo cliente
  </button>
</div>

<form class="panel form-card" [formGroup]="transactionForm" (ngSubmit)="submitTransaction()">
  <mat-button-toggle-group
    class="type-toggle"
    formControlName="transactionType"
    aria-label="Tipo de operação"
    (change)="onTransactionTypeChange($event.value)">
    <mat-button-toggle value="DEPOSIT"><mat-icon>south_west</mat-icon> Depósito</mat-button-toggle>
    <mat-button-toggle value="WITHDRAWAL"><mat-icon>north_east</mat-icon> Saque</mat-button-toggle>
    <mat-button-toggle value="TRANSFER"><mat-icon>swap_horiz</mat-icon> Transferência</mat-button-toggle>
  </mat-button-toggle-group>

  <ng-container *ngIf="transactionForm.get('transactionType')?.value; else pickType">
    <mat-form-field appearance="outline">
      <mat-label>{{ isTransfer() ? 'Cliente de origem' : 'Cliente' }}</mat-label>
      <input matInput formControlName="customerName" [matAutocomplete]="auto" autocomplete="off">
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onCustomerSelected($event)">
        <mat-option *ngFor="let customer of (filteredCustomers$ | async)" [value]="customer.name">
          {{ customer.name }}
          <small class="option-hint">{{ customer.bankName }}</small>
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="isTransfer()">
      <mat-label>Cliente de destino</mat-label>
      <input matInput formControlName="recipientName" [matAutocomplete]="autoRecipient" autocomplete="off">
      <mat-autocomplete #autoRecipient="matAutocomplete" (optionSelected)="onRecipientSelected($event)">
        <mat-option *ngFor="let customer of (filteredRecipients$ | async)" [value]="customer.name">
          {{ customer.name }}
          <small class="option-hint">{{ customer.bankName }}</small>
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor</mat-label>
      <input matInput type="text" formControlName="amount" (input)="formatCurrencyOnInput()" inputmode="numeric" placeholder="R$ 0,00">
    </mat-form-field>

    <div class="actions">
      <button mat-button type="button" (click)="onCancel($event)">Cancelar</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="!transactionForm.valid">
        {{ getSubmitButtonLabel() }}
      </button>
    </div>
  </ng-container>

  <ng-template #pickType>
    <p class="hint">Escolha o tipo de operação para começar.</p>
  </ng-template>
</form>
